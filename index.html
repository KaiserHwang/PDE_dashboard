// src/renderer.js
// 고해상도(Retina/High-DPI) HTML5 Canvas 1D/2D/3D 과학 가시화 렌더러
// 2D 컬러맵 필드, 라그랑주 입자 추적, 속도 벡터장(Quiver), 3D 회전 서피스, x-t 특성선 다이어그램, 스텐실 현미경
function sampleColormap(tNorm, mapName = "turbo") {
  const t = Math.max(0.0, Math.min(1.0, Number.isFinite(tNorm) ? tNorm : 0.5));

  if (mapName === "rdbu") {
    // Diverging Blue -> Dark/Neutral -> Red-Orange (와도, 파동 변위, 압력 섭동용)
    if (t < 0.5) {
      const s = t * 2.0;
      const r = Math.round(18 + s * (238 - 18));
      const g = Math.round(98 + s * (242 - 98));
      const b = Math.round(215 + s * (248 - 215));
      return [r, g, b];
    }
    const s = (t - 0.5) * 2.0;
    const r = Math.round(238 + s * (225 - 238));
    const g = Math.round(242 - s * (242 - 48));
    const b = Math.round(248 - s * (248 - 62));
    return [r, g, b];
  }

  if (mapName === "schlieren") {
    // 광학 슐리렌 흑백 명암 (고구배 영역이 밝은 은백색/시안빛으로 발광)
    const v = Math.pow(t, 0.75);
    const r = Math.round(14 + v * 235);
    const g = Math.round(18 + v * 238);
    const b = Math.round(26 + v * 245);
    return [r, g, b];
  }

  if (mapName === "ocean") {
    // 천수 방정식 수면용 (Deep Navy -> Teal -> Aqua -> White Foam)
    if (t < 0.5) {
      const s = t * 2;
      return [Math.round(10 + s * 15), Math.round(35 + s * 115), Math.round(90 + s * 110)];
    }
    const s = (t - 0.5) * 2;
    return [Math.round(25 + s * 215), Math.round(150 + s * 98), Math.round(200 + s * 55)];
  }

  // 기본 Viridis/Turbo 하이브리드 고대비 과학 컬러맵
  const stops = [
    [15, 23, 62],
    [28, 86, 168],
    [16, 165, 162],
    [110, 208, 88],
    [245, 196, 42],
    [239, 78, 42],
  ];
  const scaled = t * (stops.length - 1);
  const idx = Math.min(stops.length - 2, Math.floor(scaled));
  const frac = scaled - idx;
  const c0 = stops[idx];
  const c1 = stops[idx + 1];
  return [
    Math.round(c0[0] + frac * (c1[0] - c0[0])),
    Math.round(c0[1] + frac * (c1[1] - c0[1])),
    Math.round(c0[2] + frac * (c1[2] - c0[2])),
  ];
}
function prepareCanvas(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(260, Math.floor(rect.width));
  const h = Math.max(180, Math.floor(rect.height));
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr;
    canvas.height = h * dpr;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function drawGridAndAxes(ctx, pad, w, h, xMin, xMax, yMin, yMax, xLabel, yLabel) {
  const pw = w - pad.l - pad.r;
  const ph = h - pad.t - pad.b;

  ctx.fillStyle = "#0b1221";
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = "#0f172a";
  ctx.fillRect(pad.l, pad.t, pw, ph);

  ctx.strokeStyle = "rgba(148, 163, 184, 0.14)";
  ctx.lineWidth = 1;
  ctx.font = "11px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#94a3b8";

  const nx = 5;
  for (let i = 0; i <= nx; i++) {
    const x = pad.l + (i / nx) * pw;
    ctx.beginPath();
    ctx.moveTo(x, pad.t);
    ctx.lineTo(x, pad.t + ph);
    ctx.stroke();
    const val = xMin + (i / nx) * (xMax - xMin);
    ctx.textAlign = "center";
    ctx.fillText(val.toFixed(2), x, pad.t + ph + 16);
  }

  const ny = 4;
  for (let j = 0; j <= ny; j++) {
    const y = pad.t + (j / ny) * ph;
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(pad.l + pw, y);
    ctx.stroke();
    const val = yMax - (j / ny) * (yMax - yMin);
    ctx.textAlign = "right";
    ctx.fillText(val.toFixed(2), pad.l - 6, y + 4);
  }

  // y=0 기준선
  if (yMin < 0 && yMax > 0) {
    const y0 = pad.t + ((yMax - 0) / (yMax - yMin)) * ph;
    ctx.strokeStyle = "rgba(226, 232, 240, 0.28)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(pad.l, y0);
    ctx.lineTo(pad.l + pw, y0);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.strokeStyle = "rgba(148, 163, 184, 0.32)";
  ctx.strokeRect(pad.l, pad.t, pw, ph);

  ctx.fillStyle = "#cbd5e1";
  ctx.font = "600 11px 'Pretendard', sans-serif";
  ctx.textAlign = "center";
  if (xLabel) ctx.fillText(xLabel, pad.l + pw / 2, h - 6);
  if (yLabel) {
    ctx.save();
    ctx.translate(13, pad.t + ph / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(yLabel, 0, 0);
    ctx.restore();
  }

  return {
    pw,
    ph,
    toX: (xv) => pad.l + ((xv - xMin) / Math.max(xMax - xMin, 1e-9)) * pw,
    toY: (yv) => pad.t + ((yMax - yv) / Math.max(yMax - yMin, 1e-9)) * ph,
    fromX: (px) => xMin + ((px - pad.l) / Math.max(pw, 1)) * (xMax - xMin),
  };
}

function drawArrow(ctx, x1, y1, x2, y2, color, width = 2, label = "") {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 2) return;
  const angle = Math.atan2(dy, dx);
  const head = Math.min(9, len * 0.35);

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();

  if (label) {
    ctx.font = "600 11px 'Pretendard', sans-serif";
    ctx.fillText(label, x2 + (dx >= 0 ? 6 : -6), y2 - 4);
  }
  ctx.restore();
}

/**
 * ODE 메인 캔버스 렌더링 (물리 기구 다이어그램 + 시간 파형 / 3D 로렌츠 / 2D 케플러 궤도)
 */
function renderODEMain(canvas, sim, options = {}) {
  const { ctx, w, h } = prepareCanvas(canvas);
  const labId = sim.labId;
  const p = sim.params;
  const hist = sim.history;

  if (labId === "chaos_orbit") {
    if ((p.submode || "lorenz") === "kepler") {
      // 2D 케플러 행성 궤도 평면
      ctx.fillStyle = "#09101f";
      ctx.fillRect(0, 0, w, h);
      const cx = w * 0.54;
      const cy = h * 0.5;
      const scale = Math.min(w, h) * 0.28;

      // 배경 원형 그리드
      ctx.strokeStyle = "rgba(148, 163, 184, 0.14)";
      for (const r of [0.5, 1.0, 1.5]) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * scale, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 엄밀 케플러 타원 궤도
      const e = Math.min(Math.max(p.ecc ?? 0.5, 0), 0.85);
      const pSemi = 1 - e * e;
      ctx.strokeStyle = "rgba(16, 185, 129, 0.45)";
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      for (let k = 0; k <= 120; k++) {
        const phi = (k / 120) * Math.PI * 2;
        const r = pSemi / (1 + e * Math.cos(phi));
        const px = cx + r * Math.cos(phi) * scale;
        const py = cy - r * Math.sin(phi) * scale;
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.setLineDash([]);

      // 다중 기법 비교 궤적 (Euler vs Verlet)
      if (options.compareSchemes) {
        const drawOrbitTrail = (arr, color) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          arr.forEach((pt, idx) => {
            const px = cx + pt.x * scale;
            const py = cy - pt.y * scale;
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.stroke();
        };
        drawOrbitTrail(hist.euler, "rgba(245, 158, 11, 0.75)");
        drawOrbitTrail(hist.verlet, "rgba(16, 185, 129, 0.85)");
      }

      // 주 궤적
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      hist.primary.forEach((pt, idx) => {
        const px = cx + pt.x * scale;
        const py = cy - pt.y * scale;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();

      // 중심 항성
      const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 16);
      grad.addColorStop(0, "#fef08a");
      grad.addColorStop(0.5, "#f59e0b");
      grad.addColorStop(1, "rgba(245, 158, 11, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI * 2);
      ctx.fill();

      // 현재 행성 위치 및 중력/속도 벡터
      const cur = sim.state;
      const px = cx + cur.x * scale;
      const py = cy - cur.y * scale;
      const rMag = Math.hypot(cur.x, cur.y);
      drawArrow(ctx, px, py, px + cur.vx * 28, py - cur.vy * 28, "#10b981", 2.2, "v");
      drawArrow(
        ctx,
        px,
        py,
        px - (cur.x / Math.max(rMag ** 3, 0.2)) * 22,
        py + (cur.y / Math.max(rMag ** 3, 0.2)) * 22,
        "#ef4444",
        2.2,
        "F_g"
      );

      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(px, py, 6.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#e2e8f0";
      ctx.font = "600 12px 'Pretendard', sans-serif";
      ctx.fillText(`케플러 중심력 궤도 (e=${e.toFixed(2)}) · 녹색 점선: 엄밀 타원`, 16, 24);
      return;
    }

    // 3D 로렌츠 열대류 카오스 어트랙터
    ctx.fillStyle = "#09101f";
    ctx.fillRect(0, 0, w, h);
    const yaw = options.rotYaw ?? 0.65;
    const pitch = options.rotPitch ?? 0.32;
    const cosY = Math.cos(yaw);
    const sinY = Math.sin(yaw);
    const cosP = Math.cos(pitch);
    const sinP = Math.sin(pitch);
    const scale = Math.min(w, h) * 0.0145;
    const cx = w * 0.5;
    const cy = h * 0.55;

    const proj = (pt) => {
      const zShift = pt.z - 25;
      const x1 = pt.x * cosY - pt.y * sinY;
      const y1 = pt.x * sinY + pt.y * cosY;
      const y2 = y1 * cosP - zShift * sinP;
      return { px: cx + x1 * scale, py: cy - zShift * cosP * scale - y1 * sinP * scale * 0.5 + y2 * 0.1 };
    };

    const drawTrail3D = (arr, color, width) => {
      if (arr.length < 2) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      arr.forEach((pt, idx) => {
        const { px, py } = proj(pt);
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
    };

    drawTrail3D(hist.exact, "rgba(245, 158, 11, 0.82)", 1.9);
    drawTrail3D(hist.primary, "rgba(56, 189, 248, 0.92)", 2.3);

    const p1 = proj(sim.state);
    const p2 = proj(sim.twin);
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.arc(p1.px, p1.py, 5.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.arc(p2.px, p2.py, 5.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#e2e8f0";
    ctx.font = "600 12px 'Pretendard', sans-serif";
    ctx.fillText("로렌츠 열대류 3D 어트랙터 (청색: 기준 궤적 / 주황: +10⁻⁴ 교란 궤적 · 드래그하여 3D 회전)", 14, 22);
    return;
  }

  // 상단 36%: 실시간 물리 메커니즘 애니메이션 (스프링-질량-힘벡터 또는 비선형 진자)
  // 하단 64%: 시간 궤적 x(t)
  const topH = Math.floor(h * 0.37);
  ctx.fillStyle = "#0b1221";
  ctx.fillRect(0, 0, w, h);

  if (labId === "oscillator") {
    // 스프링-댐퍼-질량 블록 및 실시간 힘 벡터 분해 표시
    const wallX = 42;
    const eqX = w * 0.52;
    const xScale = Math.min(w * 0.18, 95);
    const massX = Math.max(wallX + 36, Math.min(w - 40, eqX + sim.state.x * xScale));
    const midY = topH * 0.55;

    // 벽면 & 평형선
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(wallX, midY - 26);
    ctx.lineTo(wallX, midY + 26);
    ctx.stroke();

    ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(eqX, 12);
    ctx.lineTo(eqX, topH - 8);
    ctx.stroke();
    ctx.setLineDash([]);

    // 지그재그 스프링
    const coils = 12;
    const span = massX - 22 - wallX;
    ctx.strokeStyle = "#10b981";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wallX, midY);
    for (let i = 1; i <= coils; i++) {
      const xi = wallX + ((i - 0.5) / coils) * span;
      const yi = midY + (i % 2 === 0 ? -9 : 9);
      ctx.lineTo(xi, yi);
    }
    ctx.lineTo(massX - 22, midY);
    ctx.stroke();

    // 질량 블록
    ctx.fillStyle = "#1e293b";
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.roundRect(massX - 22, midY - 18, 44, 36, 7);
    ctx.fill();
    ctx.stroke();

    // 실시간 힘 화살표 (복원력, 감쇠력, 구동 외력)
    const terms = sim.getTermBreakdown();
    const fScale = 8.5;
    drawArrow(ctx, massX, midY - 10, massX + terms[0].value * fScale, midY - 10, "#10b981", 2.2, "F_복원");
    drawArrow(ctx, massX, midY + 2, massX + terms[1].value * fScale, midY + 2, "#f59e0b", 2.2, "F_감쇠");
    if (Math.abs(terms[2].value) > 0.02) {
      drawArrow(ctx, massX, midY + 14, massX + terms[2].value * fScale, midY + 14, "#ec4899", 2.2, "F_외력");
    }
  } else if (labId === "pendulum") {
    // 비선형 진자(실선) vs 소각도 선형 근사 진자(점선 유령) 실시간 물리 비교
    const pivotX = w * 0.5;
    const pivotY = topH * 0.25;
    const len = Math.min(topH * 0.62, 68);
    const th = sim.state.x;
    const thLin = sim.linearRef.x;

    // 선형 근사 유령 진자
    const lx = pivotX + len * Math.sin(thLin);
    const ly = pivotY + len * Math.cos(thLin);
    ctx.strokeStyle = "rgba(16, 185, 129, 0.45)";
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(lx, ly);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(16, 185, 129, 0.55)";
    ctx.beginPath();
    ctx.arc(lx, ly, 6, 0, Math.PI * 2);
    ctx.fill();

    // 실제 비선형 진자
    const bx = pivotX + len * Math.sin(th);
    const by = pivotY + len * Math.cos(th);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(bx, by);
    ctx.stroke();
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.arc(bx, by, 8.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#94a3b8";
    ctx.font = "11px 'Pretendard', sans-serif";
    ctx.fillText(`실제 각도 θ = ${((th * 180) / Math.PI).toFixed(1)}° (녹색 점선: 선형 근사 sin θ ≈ θ)`, 14, 18);
  }

  // 하단 시간 파형 플롯
  const pad = { l: 48, r: 16, t: topH + 10, b: 28 };
  const tArr = hist.t;
  const tMin = tArr.length ? tArr[0] : 0;
  const tMax = Math.max(tMin + 2.0, tArr.length ? tArr[tArr.length - 1] : 2.0);

  let yMax = 1.5;
  for (const v of hist.primary) yMax = Math.max(yMax, Math.abs(v) * 1.15);
  yMax = Math.min(Math.max(yMax, 1.2), 12.0);

  const mapper = drawGridAndAxes(ctx, pad, w, h, tMin, tMax, -yMax, yMax, "시간 t", labId === "pendulum" ? "각도 θ (rad)" : "변위 x(t)");
  // 상단 물리 영역 다시 그리기 보존을 위해 상단 영역만 위에서 그림 -> drawGridAndAxes가 전체 배경을 덮지 않도록 유의!
  // 잠깐: drawGridAndAxes가 (0,0,w,h)를 칠하므로 상단 물리 다이어그램을 drawGridAndAxes 이후에 그리자!
  drawODEPhysicalHeader(ctx, w, topH, sim);

  const plotLine = (arr, color, width = 2.2, dashed = false) => {
    if (!arr || arr.length < 2) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    if (dashed) ctx.setLineDash([5, 4]);
    ctx.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const px = mapper.toX(tArr[i]);
      const py = Math.max(pad.t, Math.min(h - pad.b, mapper.toY(arr[i])));
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  };

  if (options.compareSchemes) {
    plotLine(hist.euler, "#f59e0b", 1.7, false);
    plotLine(hist.verlet, "#a855f7", 1.7, false);
  }
  plotLine(hist.exact, "#10b981", 2.0, true);
  plotLine(hist.primary, "#38bdf8", 2.6, false);
}

function drawODEPhysicalHeader(ctx, w, topH, sim) {
  ctx.fillStyle = "#080f1d";
  ctx.fillRect(0, 0, w, topH);
  ctx.strokeStyle = "rgba(148, 163, 184, 0.2)";
  ctx.beginPath();
  ctx.moveTo(0, topH);
  ctx.lineTo(w, topH);
  ctx.stroke();

  const labId = sim.labId;
  const midY = topH * 0.56;

  if (labId === "oscillator") {
    const wallX = 44;
    const eqX = w * 0.52;
    const xScale = Math.min(w * 0.16, 85);
    const massX = Math.max(wallX + 38, Math.min(w - 42, eqX + sim.state.x * xScale));

    ctx.strokeStyle = "#64748b";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(wallX, midY - 24);
    ctx.lineTo(wallX, midY + 24);
    ctx.stroke();

    ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(eqX, 8);
    ctx.lineTo(eqX, topH - 6);
    ctx.stroke();
    ctx.setLineDash([]);

    const coils = 12;
    const span = massX - 22 - wallX;
    ctx.strokeStyle = "#10b981";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wallX, midY);
    for (let i = 1; i <= coils; i++) {
      const xi = wallX + ((i - 0.5) / coils) * span;
      const yi = midY + (i % 2 === 0 ? -8 : 8);
      ctx.lineTo(xi, yi);
    }
    ctx.lineTo(massX - 22, midY);
    ctx.stroke();

    ctx.fillStyle = "#1e293b";
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.roundRect(massX - 22, midY - 17, 44, 34, 7);
    ctx.fill();
    ctx.stroke();

    const terms = sim.getTermBreakdown();
    const fScale = 6.5;
    drawArrow(ctx, massX, midY - 9, massX + terms[0].value * fScale, midY - 9, "#10b981", 2.2, "복원력");
    drawArrow(ctx, massX, midY + 2, massX + terms[1].value * fScale, midY + 2, "#f59e0b", 2.2, "감쇠력");
    if (Math.abs(terms[2].value) > 0.02) {
      drawArrow(ctx, massX, midY + 13, massX + terms[2].value * fScale, midY + 13, "#ec4899", 2.2, "구동외력");
    }

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "600 11px 'Pretendard', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("실시간 힘 벡터 분해 · 청색 실선: 수치해 / 녹색 점선: 엄밀 해석해", 12, 16);
  } else if (labId === "pendulum") {
    const pivotX = w * 0.5;
    const pivotY = topH * 0.24;
    const len = Math.min(topH * 0.62, 64);
    const th = sim.state.x;
    const thLin = sim.linearRef.x;

    const lx = pivotX + len * Math.sin(thLin);
    const ly = pivotY + len * Math.cos(thLin);
    ctx.strokeStyle = "rgba(16, 185, 129, 0.5)";
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(lx, ly);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(16, 185, 129, 0.6)";
    ctx.beginPath();
    ctx.arc(lx, ly, 5.5, 0, Math.PI * 2);
    ctx.fill();

    const bx = pivotX + len * Math.sin(th);
    const by = pivotY + len * Math.cos(th);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(bx, by);
    ctx.stroke();
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.arc(bx, by, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#cbd5e1";
    ctx.font = "600 11px 'Pretendard', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`실시간 진자 비교: θ = ${((th * 180) / Math.PI).toFixed(1)}° (녹색 점선: 소각도 선형 근사 sin θ ≈ θ)`, 12, 16);
  }
}

/**
 * ODE 보조 캔버스 렌더링 (위상 공간 궤적 + 벡터장 / 공명 곡선 / 보존 에너지 진화)
 */
function renderODESecondary(canvas, sim, resonanceData, mode = "phase") {
  const { ctx, w, h } = prepareCanvas(canvas);
  const pad = { l: 48, r: 16, t: 28, b: 30 };
  const hist = sim.history;
  const p = sim.params;

  if (mode === "resonance" && sim.labId === "oscillator" && resonanceData) {
    const maxAmp = Math.min(12.0, Math.max(...resonanceData.ampArr, 2.5));
    const mapper = drawGridAndAxes(ctx, pad, w, h, 0, 2.5, 0, maxAmp, "주파수비 r = ω_d / ω_0", "동적 증폭비 M(r)");

    // r = 1 공명 수직선
    const xRes = mapper.toX(1.0);
    ctx.strokeStyle = "rgba(236, 72, 153, 0.45)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(xRes, pad.t);
    ctx.lineTo(xRes, h - pad.b);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = "#ec4899";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    resonanceData.rArr.forEach((r, idx) => {
      const px = mapper.toX(r);
      const py = Math.max(pad.t, mapper.toY(resonanceData.ampArr[idx]));
      if (idx === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.stroke();

    // 현재 운전 주파수비 마커
    const rCur = (p.omegad || 4.0) / Math.max(p.omega0 || 4.0, 0.1);
    const z = Math.max(p.zeta || 0.05, 0.025);
    const mCur = 1.0 / Math.sqrt((1 - rCur * rCur) ** 2 + (2 * z * rCur) ** 2);
    const cx = mapper.toX(Math.min(2.5, rCur));
    const cy = Math.max(pad.t, mapper.toY(mCur));
    ctx.fillStyle = "#38bdf8";
    ctx.beginPath();
    ctx.arc(cx, cy, 6.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#e2e8f0";
    ctx.font = "600 12px 'Pretendard', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`공명 응답 곡선 · 현재 ω_d/ω_0 = ${rCur.toFixed(2)} (증폭비 ${mCur.toFixed(2)}배)`, 12, 18);
    return;
  }

  if (mode === "energy" || sim.labId === "chaos_orbit") {
    const tArr = hist.t;
    const tMin = tArr[0] || 0;
    const tMax = Math.max(tMin + 1, tArr.at(-1) || 1);
    const allE = [...hist.energy, ...hist.energyEuler, ...hist.energyVerlet].filter(Number.isFinite);
    const eMin = Math.min(...allE, 0);
    const eMax = Math.max(...allE, eMin + 0.5);
    const mapper = drawGridAndAxes(
      ctx,
      pad,
      w,
      h,
      tMin,
      tMax,
      eMin - 0.05 * (eMax - eMin),
      eMax + 0.08 * (eMax - eMin),
      "시간 t",
      sim.labId === "chaos_orbit" && (p.submode || "lorenz") === "lorenz" ? "궤적 차이 |ΔX(t)|" : "역학적 에너지 E(t)"
    );

    const drawE = (arr, color) => {
      if (!arr || arr.length < 2) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < arr.length; i++) {
        const px = mapper.toX(tArr[i]);
        const py = Math.max(pad.t, Math.min(h - pad.b, mapper.toY(arr[i])));
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    };
    drawE(hist.energyEuler, "#f59e0b");
    drawE(hist.energyVerlet, "#10b981");
    drawE(hist.energy, "#38bdf8");

    ctx.fillStyle = "#e2e8f0";
    ctx.font = "600 12px 'Pretendard', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(
      sim.labId === "chaos_orbit" && (p.submode || "lorenz") === "lorenz"
        ? "나비효과 두 궤적 간 거리 |X₁(t) − X₂(t)|"
        : "적분기별 에너지 보존 비교 (청색: 현재 / 녹색: Verlet / 주황: Euler)",
      12,
      18
    );
    return;
  }

  // 위상 공간 (Phase Portrait: x vs v) + 배경 방향장 벡터
  const xMax = sim.labId === "pendulum" ? Math.PI * 1.35 : Math.max(2.0, ...hist.primary.map(Math.abs));
  const vMax = Math.max(4.5, ...hist.velocity.map(Math.abs));
  const mapper = drawGridAndAxes(
    ctx,
    pad,
    w,
    h,
    -xMax,
    xMax,
    -vMax,
    vMax,
    sim.labId === "pendulum" ? "각도 θ" : "변위 x",
    sim.labId === "pendulum" ? "각속도 dθ/dt" : "속도 v = dx/dt"
  );

  // 배경 위상 벡터장 및 단진자 Separatrix 표시
  const accelFn = sim.getAccelFn(false);
  for (let gx = -xMax * 0.85; gx <= xMax * 0.85; gx += xMax * 0.28) {
    for (let gv = -vMax * 0.8; gv <= vMax * 0.8; gv += vMax * 0.32) {
      const dx = gv;
      const dv = accelFn(gx, gv, sim.t);
      const mag = Math.hypot(dx, dv) || 1;
      const px = mapper.toX(gx);
      const py = mapper.toY(gv);
      drawArrow(ctx, px, py, px + (dx / mag) * 11, py - (dv / mag) * 11, "rgba(148, 163, 184, 0.25)", 1);
    }
  }

  // 단진자 Separatrix (왕복 진동과 연속 회전의 경계선 v = ±2 ω0 cos(θ/2))
  if (sim.labId === "pendulum" && (p.submode || "pendulum") === "pendulum") {
    for (const sign of [-1, 1]) {
      ctx.strokeStyle = "rgba(236, 72, 153, 0.42)";
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i <= 80; i++) {
        const th = -Math.PI + (i / 80) * (2 * Math.PI);
        const vSep = sign * 2 * (p.omega0 || 3.0) * Math.cos(th / 2);
        const px = mapper.toX(th);
        const py = mapper.toY(vSep);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 2.3;
  ctx.beginPath();
  for (let i = 0; i < hist.primary.length; i++) {
    let xv = hist.primary[i];
    if (sim.labId === "pendulum") {
      xv = ((((xv + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;
    }
    const px = mapper.toX(xv);
    const py = mapper.toY(hist.velocity[i]);
    if (i === 0 || Math.abs(xv - hist.primary[i - 1]) > Math.PI) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  let curX = sim.state.x;
  if (sim.labId === "pendulum") {
    curX = ((((curX + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;
  }
  ctx.fillStyle = "#f59e0b";
  ctx.beginPath();
  ctx.arc(mapper.toX(curX), mapper.toY(sim.state.v), 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#e2e8f0";
  ctx.font = "600 12px 'Pretendard', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(
    sim.labId === "pendulum"
      ? "위상 공간 (θ, dθ/dt) · 분홍 점선: 왕복/회전 경계 Separatrix"
      : "위상 공간 궤적 (x, v) · 닫힌 타원은 에너지 보존, 안쪽 나선은 소산",
    12,
    18
  );
}

/**
 * 1D PDE 메인 파형 캔버스 렌더링 (해석해, 다중 수치기법 동시 비교, 스텐실 프로브 크로스헤어 포함)
 */
function renderPDE1DMain(canvas, sim, probeIdx, options = {}) {
  const { ctx, w, h } = prepareCanvas(canvas);
  const pad = { l: 48, r: 18, t: 32, b: 30 };
  const curves = sim.getCurrentCurves();
  const xArr = sim.x;

  let yMin = Infinity;
  let yMax = -Infinity;
  const scan = (arr) => {
    if (!arr) return;
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] < yMin) yMin = arr[i];
      if (arr[i] > yMax) yMax = arr[i];
    }
  };
  scan(curves.primary);
  scan(curves.initial);
  scan(curves.exact);
  if (curves.bathy) scan(curves.bathy);

  if (!Number.isFinite(yMin) || Math.abs(yMax - yMin) < 0.1) {
    yMin = -0.2;
    yMax = 1.2;
  } else {
    const span = yMax - yMin;
    yMin -= 0.12 * span;
    yMax += 0.16 * span;
  }

  const mapper = drawGridAndAxes(ctx, pad, w, h, 0, 1, yMin, yMax, "공간 위치 x", sim.activeField);

  // 바닥 지형 b(x) 채우기 (천수 방정식)
  if (curves.bathy) {
    ctx.fillStyle = "rgba(100, 116, 139, 0.45)";
    ctx.beginPath();
    ctx.moveTo(mapper.toX(0), mapper.toY(yMin));
    for (let i = 0; i < xArr.length; i++) {
      ctx.lineTo(mapper.toX(xArr[i]), mapper.toY(curves.bathy[i]));
    }
    ctx.lineTo(mapper.toX(1), mapper.toY(yMin));
    ctx.closePath();
    ctx.fill();
  }

  const drawCurve = (arr, color, width = 2.2, dashed = false, fillAlpha = 0) => {
    if (!arr) return;
    ctx.save();
    if (fillAlpha > 0) {
      ctx.fillStyle = color.replace(")", `, ${fillAlpha})`).replace("rgb", "rgba");
      ctx.beginPath();
      ctx.moveTo(mapper.toX(xArr[0]), mapper.toY(Math.max(0, yMin)));
      for (let i = 0; i < xArr.length; i++) {
        ctx.lineTo(mapper.toX(xArr[i]), mapper.toY(arr[i]));
      }
      ctx.lineTo(mapper.toX(xArr[xArr.length - 1]), mapper.toY(Math.max(0, yMin)));
      ctx.closePath();
      ctx.fill();
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    if (dashed) ctx.setLineDash([6, 4]);
    ctx.beginPath();
    for (let i = 0; i < xArr.length; i++) {
      const px = mapper.toX(xArr[i]);
      const py = Math.max(pad.t, Math.min(h - pad.b, mapper.toY(arr[i])));
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  };

  if (curves.initial) drawCurve(curves.initial, "rgba(148, 163, 184, 0.45)", 1.5, true);
  if (options.compareSchemes && curves.comparisons) {
    for (const comp of curves.comparisons) {
      drawCurve(comp.data, comp.color, 1.9, false);
    }
  }
  if (curves.exact) drawCurve(curves.exact, "#10b981", 2.2, true);
  drawCurve(curves.primary, "rgb(56, 189, 248)", 2.8, false, 0.12);

  // 선택된 프로브 격자점 스텐실(i-1, i, i+1) 및 접선 기울기 표시
  const st = sim.getStencilAndTerms(probeIdx);
  const pxC = mapper.toX(st.x);
  const pyC = mapper.toY(st.uCenter);

  ctx.strokeStyle = "rgba(245, 158, 11, 0.45)";
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(pxC, pad.t);
  ctx.lineTo(pxC, h - pad.b);
  ctx.stroke();
  ctx.setLineDash([]);

  for (const [idxOffset, col, rad] of [
    [-1, "#94a3b8", 4],
    [1, "#94a3b8", 4],
    [0, "#f59e0b", 6.5],
  ]) {
    const k = Math.max(0, Math.min(sim.n - 1, st.idx + idxOffset));
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(mapper.toX(xArr[k]), mapper.toY(curves.primary[k]), rad, 0, Math.PI * 2);
    ctx.fill();
  }

  // 상단 범례 및 대류 속도 화살표 표시
  ctx.fillStyle = "#e2e8f0";
  ctx.font = "600 12px 'Pretendard', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(
    `${sim.activeField} (t = ${sim.t.toFixed(3)}) · 청색: 수치해${curves.exact ? " / 녹색 점선: 엄밀해" : ""} · 주황점: 스텐실 프로브 x=${st.x.toFixed(2)}`,
    12,
    19
  );
}

/**
 * 1D 시공간(x-t) 다이어그램 & 특성선(Characteristics) 또는 보존 진단 차트 렌더링
 */
function renderPDE1DSecondary(canvas, sim, mode = "xt") {
  const { ctx, w, h } = prepareCanvas(canvas);
  const pad = { l: 48, r: 16, t: 28, b: 30 };

  if (mode === "von_neumann") {
    const vn = sim.vonNeumannData;
    if (!vn) return;
    const yMax = Math.max(1.25, ...vn.gPrimary, ...vn.gSecondary);
    const mapper = drawGridAndAxes(ctx, pad, w, h, 0, Math.PI, 0, yMax, "무차원 파수 위상 kΔx (0 → π)", "증폭 인자 |G(kΔx)|");

    // |G| = 1 안정성 한계선
    const y1 = mapper.toY(1.0);
    ctx.strokeStyle = "rgba(239, 68, 68, 0.55)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(pad.l, y1);
    ctx.lineTo(w - pad.r, y1);
    ctx.stroke();
    ctx.setLineDash([]);

    const drawG = (arr, color) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.3;
      ctx.beginPath();
      arr.forEach((v, i) => {
        const px = mapper.toX(vn.betaArr[i]);
        const py = Math.max(pad.t, Math.min(h - pad.b, mapper.toY(v)));
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
    };
    drawG(vn.gSecondary, "#10b981");
    drawG(vn.gPrimary, "#f59e0b");

    ctx.fillStyle = "#e2e8f0";
    ctx.font = "600 12px 'Pretendard', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`Von Neumann 안정성 스펙트럼 · |G| > 1 이면 격자 진동 폭발`, 12, 18);
    return;
  }

  if (mode === "diagnostics") {
    const dh = sim.diagHistory;
    const tArr = dh.t;
    const tMin = tArr[0] || 0;
    const tMax = Math.max(tMin + 0.2, tArr.at(-1) || 0.2);
    const m0 = dh.mass[0] || 1;
    const e0 = dh.energy[0] || 1;
    const mapper = drawGridAndAxes(ctx, pad, w, h, tMin, tMax, 0, 1.25, "시간 t", "정규화 보존량 (초기값=1)");

    const drawNorm = (arr, ref, color) => {
      if (arr.length < 2) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      arr.forEach((v, i) => {
        const px = mapper.toX(tArr[i]);
        const py = Math.max(pad.t, Math.min(h - pad.b, mapper.toY(v / Math.max(Math.abs(ref), 1e-6))));
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
    };
    drawNorm(dh.mass, m0, "#10b981");
    drawNorm(dh.energy, e0, "#38bdf8");

    ctx.fillStyle = "#e2e8f0";
    ctx.font = "600 12px 'Pretendard', sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("시간에 따른 총 적분량(녹색 ∫u dx) 및 제곱 에너지(청색 ½∫u² dx) 변화", 12, 18);
    return;
  }

  // 기본: x-t 시공간 다이어그램 + 특성선(Characteristic Lines)
  const tMax = Math.max(0.15, sim.t);
  const tMin = sim.xtTimes[0] ?? 0;
  const mapper = drawGridAndAxes(ctx, pad, w, h, 0, 1, tMin, tMax, "공간 위치 x", "시간 t");

  const rows = sim.xtHistory.length;
  const cols = sim.n;
  if (rows > 1) {
    let zMin = Infinity;
    let zMax = -Infinity;
    for (const r of sim.xtHistory) {
      for (let i = 0; i < r.length; i++) {
        if (r[i] < zMin) zMin = r[i];
        if (r[i] > zMax) zMax = r[i];
      }
    }
    const span = Math.max(zMax - zMin, 1e-5);
    const cellW = mapper.pw / cols + 0.8;
    const cellH = mapper.ph / rows + 0.8;

    for (let r = 0; r < rows; r++) {
      const rowArr = sim.xtHistory[r];
      const py = pad.t + ((rows - 1 - r) / rows) * mapper.ph;
      for (let c = 0; c < cols; c++) {
        const norm = (rowArr[c] - zMin) / span;
        const [cr, cg, cb] = sampleColormap(norm, "turbo");
        ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
        ctx.fillRect(pad.l + (c / cols) * mapper.pw, py, cellW, cellH);
      }
    }
  }

  // 특성선(Characteristics) 오버레이:
  // Burgers: x(t) = x0 + u0(x0)*t (교차하며 충격파 형성!)
  // Wave-Convection: x(t) = x0 + (U0 ± c)*t
  // Euler: x = 0.5 + (u-c)t, u*t, (u+c)t
  ctx.save();
  ctx.beginPath();
  ctx.rect(pad.l, pad.t, mapper.pw, mapper.ph);
  ctx.clip();

  if (sim.labId === "burgers" && sim.u0) {
    ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
    ctx.lineWidth = 1.1;
    const step = Math.max(1, Math.floor(sim.n / 16));
    for (let i = 0; i < sim.n; i += step) {
      const x0 = sim.x[i];
      const slope = sim.u0[i];
      ctx.beginPath();
      ctx.moveTo(mapper.toX(x0), mapper.toY(tMin));
      ctx.lineTo(mapper.toX(x0 + slope * (tMax - tMin)), mapper.toY(tMax));
      ctx.stroke();
    }
  } else if (sim.labId === "euler") {
    const p = sim.params;
    const ex = riemannExact1D([0.5], 0.1, p.gamma ?? 1.4, p.rhoL ?? 1, p.pL ?? 1, p.rhoR ?? 0.125, p.pR ?? 0.1);
    const cL = Math.sqrt(((p.gamma ?? 1.4) * (p.pL ?? 1)) / (p.rhoL ?? 1));
    const cR = Math.sqrt(((p.gamma ?? 1.4) * (p.pR ?? 0.1)) / (p.rhoR ?? 0.125));
    const rays = [
      { speed: -cL, color: "#38bdf8", label: "팽창파 u-c" },
      { speed: ex.uStar, color: "#f59e0b", label: "접촉면 u*" },
      { speed: cR * 1.45, color: "#ef4444", label: "충격파 S" },
    ];
    for (const ray of rays) {
      ctx.strokeStyle = ray.color;
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(mapper.toX(0.5), mapper.toY(0));
      ctx.lineTo(mapper.toX(0.5 + ray.speed * tMax), mapper.toY(tMax));
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  ctx.restore();

  ctx.fillStyle = "#e2e8f0";
  ctx.font = "600 12px 'Pretendard', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(
    sim.labId === "burgers"
      ? "x–t 시공간 지도 & 특성선 x(t)=x₀+u₀(x₀)t (직선들이 교차하는 곳에서 충격파 탄생)"
      : sim.labId === "euler"
      ? "x–t 시공간 파동 다이어그램 (좌측 팽창파 · 중앙 접촉면 · 우측 충격파)"
      : "x–t 시공간 지도 (기울어진 띠의 기울기 = 이류/파동 전파 속도 dx/dt)",
    12,
    18
  );
}

/**
 * 2D PDE 메인 캔버스 렌더링 (2D 컬러맵 필드 + 속도 벡터장 + 라그랑주 입자 + 도플러/마하콘 기하 오버레이 OR 3D 회전 서피스)
 */
function renderPDE2DMain(canvas, sim, probeI, probeJ, options = {}) {
  const { ctx, w, h } = prepareCanvas(canvas);
  const n = sim.n;
  const fieldArr = sim.getPrimaryFieldArray();

  let zMin = Infinity;
  let zMax = -Infinity;
  for (let k = 0; k < fieldArr.length; k++) {
    const v = fieldArr[k];
    if (v < zMin) zMin = v;
    if (v > zMax) zMax = v;
  }
  if (!Number.isFinite(zMin) || Math.abs(zMax - zMin) < 1e-6) {
    zMin = -1;
    zMax = 1;
  }

  const diverging =
    (zMin < -0.05 && zMax > 0.05) ||
    sim.activeField.includes("와도") ||
    sim.activeField.includes("변위") ||
    sim.activeField.includes("염료");
  if (diverging) {
    const lim = Math.max(Math.abs(zMin), Math.abs(zMax), 0.1);
    zMin = -lim;
    zMax = lim;
  }

  const mapName = sim.activeField.includes("슐리렌")
    ? "schlieren"
    : sim.labId === "shallow_water" && sim.activeField.includes("수면")
    ? "ocean"
    : diverging
    ? "rdbu"
    : "turbo";

  // 3D 서피스 뷰 모드
  if (options.view3D) {
    render3DSurface(ctx, w, h, sim, fieldArr, zMin, zMax, mapName, options);
    return;
  }

  ctx.fillStyle = "#080f1d";
  ctx.fillRect(0, 0, w, h);

  const pad = { l: 42, r: 58, t: 32, b: 28 };
  const size = Math.min(w - pad.l - pad.r, h - pad.t - pad.b);
  const ox = pad.l + (w - pad.l - pad.r - size) * 0.5;
  const oy = pad.t + (h - pad.t - pad.b - size) * 0.5;

  // 오프스크린 캔버스에 n x n 픽셀 생성 후 부드럽게 확대
  if (!canvas._offscreen || canvas._offscreen.width !== n) {
    const off = document.createElement("canvas");
    off.width = n;
    off.height = n;
    canvas._offscreen = off;
  }
  const offCtx = canvas._offscreen.getContext("2d");
  const imgData = offCtx.createImageData(n, n);
  const data = imgData.data;
  const span = Math.max(zMax - zMin, 1e-9);

  for (let j = 0; j < n; j++) {
    const rowFlip = n - 1 - j;
    for (let i = 0; i < n; i++) {
      const k = j * n + i;
      const pIdx = (rowFlip * n + i) * 4;
      if (sim.obstacle[k]) {
        data[pIdx] = 51;
        data[pIdx + 1] = 65;
        data[pIdx + 2] = 85;
        data[pIdx + 3] = 255;
        continue;
      }
      const norm = (fieldArr[k] - zMin) / span;
      const [r, g, b] = sampleColormap(norm, mapName);
      data[pIdx] = r;
      data[pIdx + 1] = g;
      data[pIdx + 2] = b;
      data[pIdx + 3] = 255;
    }
  }
  offCtx.putImageData(imgData, 0, 0);

  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(canvas._offscreen, ox, oy, size, size);
  ctx.restore();

  // 원기둥 장애물 윤곽선 강조
  if (sim.labId === "navier_stokes" && (sim.params.scenario || "cylinder") === "cylinder") {
    ctx.strokeStyle = "#cbd5e1";
    ctx.fillStyle = "#1e293b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(ox + 0.26 * size, oy + 0.5 * size, 0.075 * size, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // 라그랑주 유체 입자 추적(Lagrangian Tracer Particles) 오버레이
  if (options.showParticles !== false) {
    ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
    ctx.strokeStyle = "rgba(56, 189, 248, 0.55)";
    ctx.lineWidth = 1.3;
    for (const pt of sim.particles) {
      const px = ox + pt.x * size;
      const py = oy + (1 - pt.y) * size;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - pt.vx * 6, py + pt.vy * 6);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(px, py, 1.9, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 속도 벡터장(Quiver Arrows) 오버레이
  if (options.showVectors !== false) {
    const stride = Math.max(4, Math.floor(n / 11));
    for (let j = Math.floor(stride / 2); j < n; j += stride) {
      for (let i = Math.floor(stride / 2); i < n; i += stride) {
        if (sim.obstacle[j * n + i]) continue;
        const { ux, vy } = sim.sampleVelocity(sim.x[i], sim.y[j]);
        const mag = Math.hypot(ux, vy);
        if (mag < 1e-3) continue;
        const px = ox + sim.x[i] * size;
        const py = oy + (1 - sim.y[j]) * size;
        const scale = Math.min(16, (size / 14) * Math.min(mag, 1.5));
        drawArrow(
          ctx,
          px,
          py,
          px + (ux / mag) * scale,
          py - (vy / mag) * scale,
          "rgba(255, 255, 255, 0.65)",
          1.2
        );
      }
    }
  }

  // 이류-파동 결합 모드: 파원 및 초음속 마하 원뿔(Mach Cone) 기하선 표시
  if (sim.labId === "wave_convection" && (sim.params.submode || "advection") === "convected_wave") {
    const sx = ox + (sim.sourceX ?? 0.35) * size;
    const sy = oy + (1 - (sim.sourceY ?? 0.5)) * size;
    const cx = sim.toggles.convectionOn ? sim.params.cx ?? 1.0 : 0.0;
    const cy = sim.toggles.convectionOn ? sim.params.cy ?? 0.0 : 0.0;
    const uMag = Math.hypot(cx, cy);
    const wc = Math.max(sim.params.waveC ?? 1.0, 0.05);
    const mach = uMag / wc;

    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(sx, sy, 5, 0, Math.PI * 2);
    ctx.fill();

    if (mach > 1.02) {
      const flowAngle = Math.atan2(-cy, cx);
      const mu = Math.asin(1.0 / mach);
      ctx.strokeStyle = "rgba(250, 204, 21, 0.85)";
      ctx.setLineDash([6, 4]);
      ctx.lineWidth = 2;
      for (const sgn of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(
          sx + Math.cos(flowAngle + sgn * mu) * size * 0.75,
          sy + Math.sin(flowAngle + sgn * mu) * size * 0.75
        );
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }
  }

  // 프로브 크로스헤어 및 단면선 표시
  const pxProbe = ox + sim.x[probeI] * size;
  const pyProbe = oy + (1 - sim.y[probeJ]) * size;
  ctx.strokeStyle = "rgba(245, 158, 11, 0.55)";
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(ox, pyProbe);
  ctx.lineTo(ox + size, pyProbe);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = "#f59e0b";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(pxProbe, pyProbe, 6.5, 0, Math.PI * 2);
  ctx.stroke();

  // 우측 컬러바
  const cbX = ox + size + 12;
  const cbW = 12;
  for (let row = 0; row < size; row++) {
    const norm = 1 - row / size;
    const [r, g, b] = sampleColormap(norm, mapName);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(cbX, oy + row, cbW, 1.5);
  }
  ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
  ctx.strokeRect(cbX, oy, cbW, size);
  ctx.fillStyle = "#cbd5e1";
  ctx.font = "10px 'JetBrains Mono', monospace";
  ctx.textAlign = "left";
  ctx.fillText(zMax.toFixed(2), cbX + cbW + 4, oy + 9);
  ctx.fillText(zMin.toFixed(2), cbX + cbW + 4, oy + size);

  ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
  ctx.strokeRect(ox, oy, size, size);

  ctx.fillStyle = "#e2e8f0";
  ctx.font = "600 12px 'Pretendard', sans-serif";
  ctx.fillText(
    `${sim.activeField} (t=${sim.t.toFixed(3)}) · 화면을 터치/드래그하여 파원·열원·소용돌이 주입`,
    12,
    19
  );

  // 캔버스 좌표 변환 헬퍼 저장 (터치 이벤트용)
  canvas._plotRect = { ox, oy, size };
}

function render3DSurface(ctx, w, h, sim, fieldArr, zMin, zMax, mapName, options) {
  ctx.fillStyle = "#080f1d";
  ctx.fillRect(0, 0, w, h);

  const n = sim.n;
  const step = Math.max(1, Math.floor(n / 34));
  const yaw = options.rotYaw ?? 0.68;
  const pitch = options.rotPitch ?? 0.55;
  const cosY = Math.cos(yaw);
  const sinY = Math.sin(yaw);
  const cosP = Math.cos(pitch);
  const sinP = Math.sin(pitch);

  const scale = Math.min(w, h) * 0.62;
  const cx = w * 0.5;
  const cy = h * 0.56;
  const span = Math.max(zMax - zMin, 1e-6);

  const project = (xNorm, yNorm, zNorm) => {
    const X = xNorm - 0.5;
    const Y = yNorm - 0.5;
    const Z = (zNorm - 0.5) * 0.48;
    const rx = X * cosY - Y * sinY;
    const ry = X * sinY + Y * cosY;
    const sx = cx + rx * scale;
    const sy = cy + (ry * sinP - Z * cosP) * scale;
    return { sx, sy, depth: ry };
  };

  // 뒤에서 앞으로 쿼드 메쉬 정렬 및 페인터 렌더링
  const quads = [];
  for (let j = 0; j < n - step; j += step) {
    for (let i = 0; i < n - step; i += step) {
      const v00 = (fieldArr[j * n + i] - zMin) / span;
      const v10 = (fieldArr[j * n + (i + step)] - zMin) / span;
      const v11 = (fieldArr[(j + step) * n + (i + step)] - zMin) / span;
      const v01 = (fieldArr[(j + step) * n + i] - zMin) / span;
      const avg = 0.25 * (v00 + v10 + v11 + v01);

      const p00 = project(sim.x[i], sim.y[j], v00);
      const p10 = project(sim.x[i + step], sim.y[j], v10);
      const p11 = project(sim.x[i + step], sim.y[j + step], v11);
      const p01 = project(sim.x[i], sim.y[j + step], v01);

      quads.push({ p00, p10, p11, p01, avg, depth: p00.depth + p11.depth });
    }
  }
  quads.sort((a, b) => a.depth - b.depth);

  for (const q of quads) {
    const [r, g, b] = sampleColormap(q.avg, mapName);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.strokeStyle = "rgba(15, 23, 42, 0.32)";
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(q.p00.sx, q.p00.sy);
    ctx.lineTo(q.p10.sx, q.p10.sy);
    ctx.lineTo(q.p11.sx, q.p11.sy);
    ctx.lineTo(q.p01.sx, q.p01.sy);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  ctx.fillStyle = "#e2e8f0";
  ctx.font = "600 12px 'Pretendard', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(`3D 공간 분포 서피스 (${sim.activeField}) · 화면을 드래그하여 3D 시점 회전`, 12, 19);
}

/**
 * 2D 보조 캔버스: 프로브 수평 단면 파형 (y = y_probe) 실시간 비교
 */
function renderPDE2DSlice(canvas, sim, probeI, probeJ) {
  const { ctx, w, h } = prepareCanvas(canvas);
  const pad = { l: 48, r: 16, t: 28, b: 30 };
  const n = sim.n;
  const fieldArr = sim.getPrimaryFieldArray();

  let yMin = Infinity;
  let yMax = -Infinity;
  for (let k = 0; k < fieldArr.length; k++) {
    if (fieldArr[k] < yMin) yMin = fieldArr[k];
    if (fieldArr[k] > yMax) yMax = fieldArr[k];
  }
  if (!Number.isFinite(yMin) || Math.abs(yMax - yMin) < 0.05) {
    yMin = -0.5;
    yMax = 1.0;
  } else {
    const sp = yMax - yMin;
    yMin -= 0.1 * sp;
    yMax += 0.12 * sp;
  }

  const mapper = drawGridAndAxes(
    ctx,
    pad,
    w,
    h,
    0,
    1,
    yMin,
    yMax,
    "x 위치",
    `y = ${sim.y[probeJ].toFixed(2)} 단면`
  );

  // 초기 단면 점선
  ctx.strokeStyle = "rgba(148, 163, 184, 0.4)";
  ctx.setLineDash([4, 4]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const px = mapper.toX(sim.x[i]);
    const py = mapper.toY(sim.u0[probeJ * n + i]);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // 현재 단면 실선
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const px = mapper.toX(sim.x[i]);
    const py = Math.max(pad.t, Math.min(h - pad.b, mapper.toY(fieldArr[probeJ * n + i])));
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  const curVal = fieldArr[probeJ * n + probeI];
  ctx.fillStyle = "#f59e0b";
  ctx.beginPath();
  ctx.arc(mapper.toX(sim.x[probeI]), mapper.toY(curVal), 5.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#e2e8f0";
  ctx.font = "600 12px 'Pretendard', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(`2D 필드의 1D 수평 단면 (y = ${sim.y[probeJ].toFixed(2)}) · 회색 점선: 초기 분포`, 12, 18);
}

function introCoolingFrames(params) {
  const interval = params.interval ?? 0.5, rate = params.rate ?? 0.15;
  const frames = [], end = 20;
  let temperature = 80;
  for (let i = 0; i <= Math.round(end / interval); i++) {
    const t = i * interval;
    frames.push({t, value:temperature, exact:20 + 60 * Math.exp(-rate * t)});
    temperature += interval * (-rate * (temperature - 20));
  }
  return {frames, dt:interval};
}
function buildIntroHeat(params = {}, plate = false) {
  const n = plate ? 25 : 21, dx = plate ? 1 : 2;
  const alpha = params.alpha ?? (plate ? 1.5 : 2);
  const x = Array.from({length:n}, (_, i) => i * dx);
  let values = new Float64Array(plate ? n * n : n);
  for (let j = 0; j < (plate ? n : 1); j++) {
    for (let i = 0; i < n; i++) {
      const r2 = plate ? (x[i] - 12)**2 + (x[j] - 12)**2 : (x[i] - 20)**2;
      values[j * n + i] = 20 + 60 * Math.exp(-r2 / (plate ? 12 : 32));
    }
  }
  const fixBoundary = arr => {
    for (let j = 0; j < (plate ? n : 1); j++) for (let i = 0; i < n; i++) {
      if (i === 0 || i === n - 1 || (plate && (j === 0 || j === n - 1))) arr[j*n+i] = 20;
    }
  };
  fixBoundary(values);
  const interval = plate ? 0.1 : 0.25, end = plate ? 8 : 20;
  const frames = [{t:0, values:values.slice()}];
  const substeps = Math.ceil(interval / ((plate ? 0.2 : 0.4) * dx**2 / alpha));
  const dt = interval / substeps;
  for (let frame = 1; frame <= Math.round(end / interval); frame++) {
    for (let step = 0; step < substeps; step++) {
      const next = values.slice();
      if (plate) {
        for (let j = 1; j < n-1; j++) for (let i = 1; i < n-1; i++) {
          const k = j*n+i;
          next[k] += alpha*dt/dx**2 * (values[k-1]+values[k+1]+values[k-n]+values[k+n]-4*values[k]);
        }
      } else {
        for (let i = 1; i < n-1; i++) next[i] += alpha*dt/dx**2 * (values[i-1]-2*values[i]+values[i+1]);
      }
      values = next;
    }
    frames.push({t:frame*interval, values:values.slice()});
  }
  return {frames, x, dx, dt, n, alpha};
}
function buildIntroWave(params = {}) {
  const n=61, dx=100/(n-1), speed=params.waveSpeed ?? 20, interval=0.05;
  const x=Array.from({length:n}, (_, i)=>i*dx);
  let q=Float64Array.from(x, xx=>3*Math.sin(Math.PI*xx/100)), v=new Float64Array(n);
  q[0]=q[n-1]=0;
  const frames=[{t:0, values:q.slice(), velocity:v.slice()}];
  const substeps=Math.ceil(interval/(0.5*dx/speed)), dt=interval/substeps;
  for(let frame=1;frame<=160;frame++) {
    for(let step=0;step<substeps;step++) {
      const vh=v.slice(), next=q.slice();
      for(let i=1;i<n-1;i++) {
        vh[i] += 0.5*dt*speed**2*(q[i-1]-2*q[i]+q[i+1])/dx**2;
        next[i] += dt*vh[i];
      }
      v=vh.slice();
      for(let i=1;i<n-1;i++) v[i] += 0.5*dt*speed**2*(next[i-1]-2*next[i]+next[i+1])/dx**2;
      q=next;
    }
    frames.push({t:frame*interval, values:q.slice(), velocity:v.slice()});
  }
  return {frames,x,dx,dt,n,speed};
}
function buildIntroData(id, params = {}) {
  if(id === "slope") {
    const speed=params.speed ?? 2, accelerating=!!params.accelerating;
    return {frames:Array.from({length:17}, (_,i)=>({t:i/2, value:speed*i/2+(accelerating ? 0.3*(i/2)**2 : 0)})), dt:0.5};
  }
  if(id === "cooling") return introCoolingFrames(params);
  if(id === "wave") return buildIntroWave(params);
  return buildIntroHeat(params, id === "plate");
}

// Canvas의 CSS 폭을 기준으로 축을 배치한다. DPR은 글자 선명도에만 사용한다.
function introCanvas(canvas) {
  const {width, height}=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio || 1;
  canvas.width=Math.round(width*dpr); canvas.height=Math.round(height*dpr);
  const ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,width,height);
  return {ctx,w:width,h:height};
}

function introLinePlot(canvas, x, series, bounds, point, secant) {
  const {ctx,w,h}=introCanvas(canvas), p={l:53,r:19,t:29,b:46};
  const X=xx=>p.l+(w-p.l-p.r)*(xx-bounds.x0)/(bounds.x1-bounds.x0);
  const Y=yy=>h-p.b-(h-p.t-p.b)*(yy-bounds.y0)/(bounds.y1-bounds.y0);
  ctx.font="12px sans-serif"; ctx.fillStyle="#56677a";
  for(let i=0;i<=4;i++) {
    const yy=bounds.y0+(bounds.y1-bounds.y0)*i/4;
    ctx.strokeStyle="#e7edf2";ctx.beginPath();ctx.moveTo(p.l,Y(yy));ctx.lineTo(w-p.r,Y(yy));ctx.stroke();
    ctx.textAlign="right";ctx.fillText(Number(yy.toFixed(1)),p.l-7,Y(yy)+4);
    const xx=bounds.x0+(bounds.x1-bounds.x0)*i/4;
    ctx.textAlign="center";ctx.fillText(Number(xx.toFixed(1)),X(xx),h-p.b+20);
  }
  for(const s of series) {
    ctx.strokeStyle=s.color;ctx.lineWidth=s.dashed ? 1.8 : 2.8;ctx.setLineDash(s.dashed ? [5,5] : []);
    ctx.beginPath();s.y.forEach((yy,i)=>i ? ctx.lineTo(X(x[i]),Y(yy)) : ctx.moveTo(X(x[i]),Y(yy)));ctx.stroke();ctx.setLineDash([]);
  }
  if(secant) {
    ctx.strokeStyle="#c46b14";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(secant[0][0]),Y(secant[0][1]));ctx.lineTo(X(secant[1][0]),Y(secant[1][1]));ctx.stroke();
    for(const [xx,yy] of secant) {ctx.fillStyle="#c46b14";ctx.beginPath();ctx.arc(X(xx),Y(yy),5,0,2*Math.PI);ctx.fill();}
  }
  if(point) {
    ctx.setLineDash([4,4]);ctx.strokeStyle="#d28a3e";ctx.beginPath();ctx.moveTo(X(point[0]),p.t);ctx.lineTo(X(point[0]),h-p.b);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#c46b14";ctx.beginPath();ctx.arc(X(point[0]),Y(point[1]),6,0,2*Math.PI);ctx.fill();
  }
  ctx.fillStyle="#374c60";ctx.textAlign="left";ctx.fillText(bounds.ylabel,8,16);
  ctx.textAlign="center";ctx.fillText(bounds.xlabel,w/2,h-6);
}

          <section class="learn-wrapup"><span>이 단계에서 기억할 한 문장</span><p>${lesson.takeaway}</p><div class="learn-navigation"><button id="introPrevious" ${this.lessonIndex===0?'disabled':''}>← 이전 단계</button><button class="learn-primary" id="introNext">${this.lessonIndex===5?'처음부터 다시 탐험하기 ↺':'다음 단계 →'}</button></div></section>
          ${this.lessonIndex===5?'<section class="learn-next"><h3>물결과 열에서 유체로</h3><p>흐르는 물은 따뜻한 물질을 옮기고, 온도차는 열을 퍼뜨립니다. 심화 과정에서는 이 두 움직임을 연결하고, 물의 속도와 압력까지 함께 생각합니다. 오일러·나비에–스토크스 방정식은 그다음에 만날 주제예요.</p><button id="introAdvancedEnd">심화 과정 둘러보기 ↗</button></section>':''}
        </main><footer class="learn-footer">기초 모형으로 관찰합니다 · 차는 전체 온도가 같다고 가정하고, 막대·판의 가장자리는 20°C로 유지합니다.</footer>
      </div>`;
    this.bind();this.updateScene();
  }

  extraMath() {
    const id=this.lesson.id;
    if(id==='cooling') return `<p class="learn-note">계산 규칙: 온도 변화율 = −식는 계수 × (차의 온도 − 20°C). 주황색은 이 규칙을 작은 시간마다 반복한 근삿값, 회색 점선은 같은 모형의 연속 해입니다. 시간 간격을 줄이면 두 곡선이 가까워지는지 비교해 보세요.</p>`;
    if(['partial','heat','plate'].includes(id)) return `<p class="learn-note">공간 이산화는 막대나 판을 점들의 모임으로 나누는 일이고, 시간 이산화는 짧은 시간마다 온도를 갱신하는 일입니다. 이웃의 현재 온도로 다음 온도를 계산하고 이 과정을 반복합니다. 지금 계산의 공간 간격은 ${this.data.dx} cm, 내부 시간 간격은 ${this.data.dt.toFixed(4)}초입니다.</p>`;
    if(id==='wave') return '<p class="learn-note">공간을 작은 점으로 나누고, 각 점의 위치와 속도를 짧은 시간마다 갱신합니다. 이 예제는 마찰이 없는 줄이어서 진동이 이어집니다. 위치와 속도를 모두 알아야 다음 운동을 계산할 수 있어요.</p>';
    return '<p class="learn-note">평균 변화율은 두 점 사이의 기울기입니다. 이 값이 언제나 한 순간의 속력과 같지는 않아요. 시간 간격을 좁혀 순간 변화율에 다가갑니다.</p>';
  }

  bind() {
    const $=s=>this.root.querySelector(s);
    $('.learn-brand').onclick=e=>{e.preventDefault();this.loadLesson(0)};
    this.root.querySelectorAll('[data-lesson]').forEach(btn=>btn.onclick=()=>this.loadLesson(Number(btn.dataset.lesson)));
    $('#openAdvanced').onclick=()=>this.openAdvanced();
    $('#introAdvancedEnd')?.addEventListener('click',()=>this.openAdvanced());
    $('#introPlay').onclick=()=>{
      if(this.index===this.data.frames.length-1)this.index=0;
      this.playing=!this.playing;this.lastFrame=performance.now();this.updateScene();
    };
    $('#introStep').onclick=()=>{this.playing=false;this.index=Math.min(this.index+1,this.data.frames.length-1);this.updateScene()};
    $('#introReset').onclick=()=>{this.playing=false;this.index=0;this.updateScene()};
    $('#introTimeline').oninput=e=>{this.playing=false;this.index=Number(e.target.value);this.updateScene()};
    $('#introProbe')?.addEventListener('input',e=>{this.probe=Number(e.target.value);this.updateScene()});
    $('#introProbeY')?.addEventListener('input',e=>{this.probeY=Number(e.target.value);this.updateScene()});
    this.root.querySelectorAll('[data-intro-param]').forEach(input=>input.oninput=e=>{
      const key=e.target.dataset.introParam;this.params[key]=Number(e.target.value);
      const control=this.lesson.controls.find(c=>c.key===key);$(`#introControlValue_${key}`).textContent=`${e.target.value} ${control.unit}`;
      this.data=buildIntroData(this.lesson.id,this.params);this.playing=false;this.index=0;
      $('#introTimeline').max=this.data.frames.length-1;
      $('.learn-math').querySelectorAll('p.learn-note').forEach(p=>p.remove());
      $('.learn-math').insertAdjacentHTML('beforeend',this.extraMath());
      this.updateScene();
    });
    this.root.querySelectorAll('[data-motion]').forEach(btn=>btn.onclick=()=>{
      this.params.accelerating=btn.dataset.motion==='accelerating';
      this.root.querySelectorAll('[data-motion]').forEach(b=>b.classList.toggle('selected',b===btn));
      this.data=buildIntroData('slope',this.params);this.index=0;this.playing=false;this.updateScene();
    });
    this.root.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>{
      const correct=Number(btn.dataset.answer)===this.lesson.answer;
      this.root.querySelectorAll('[data-answer]').forEach(b=>{b.classList.toggle('chosen',b===btn);b.setAttribute('aria-pressed',String(b===btn))});
      $('#introFeedback').textContent=(correct?'맞아요. ':'다시 관찰해 볼까요? ')+this.lesson.feedback;
      $('#introFeedback').className=correct?'correct':'try-again';
    });
    $('#introPrevious').onclick=()=>this.loadLesson(Math.max(0,this.lessonIndex-1));
    $('#introNext').onclick=()=>{this.loadLesson((this.lessonIndex+1)%INTRO_LESSONS.length);this.root.querySelector('.learn-question').scrollIntoView({block:'start',behavior:'smooth'})};
    $('#introMainCanvas').onclick=e=>{
      if(this.lesson.id!=='plate')return;
      const rect=e.target.getBoundingClientRect(), pr=this.plateRect;
      if(!pr)return;
      this.probe=Math.max(1,Math.min(this.data.n-2,Math.floor((e.clientX-rect.left-pr.x)/pr.size*this.data.n)));
      this.probeY=Math.max(1,Math.min(this.data.n-2,this.data.n-1-Math.floor((e.clientY-rect.top-pr.y)/pr.size*this.data.n)));
      $('#introProbe').value=this.probe;$('#introProbeY').value=this.probeY;this.updateScene();
    };
  }

  openAdvanced() {this.playing=false;this.onAdvanced();}

  updateScene() {
    if(this.root.hidden)return;
    const $=s=>this.root.querySelector(s), id=this.lesson.id, data=this.data, f=data.frames[this.index];
    $('#introPlay').textContent=this.playing?'Ⅱ 잠깐 멈춤':'▶ 재생';
    $('#introClock').textContent=`${f.t.toFixed(2)} ${id==='cooling'?'분':'초'}`;
    $('#introTimeValue').textContent=$('#introClock').textContent;
    $('#introTimeline').value=this.index;
    if($('#introProbeValue'))$('#introProbeValue').textContent=`${data.x[this.probe].toFixed(1)} cm`;
    if($('#introProbeYValue'))$('#introProbeYValue').textContent=`${data.x[this.probeY].toFixed(1)} cm`;
    const num=(title,value)=>`<div class="learn-number"><span>${title}</span><strong>${value}</strong></div>`;
    let numbers='', reading='', physical='', boundary='';
    const next=data.frames[Math.min(this.index+1,data.frames.length-1)], previous=data.frames[Math.max(this.index-1,0)];
    const comparison=this.index<data.frames.length-1?next:previous;
    if(id==='slope') {
      const dt=Math.abs(comparison.t-f.t), distance=Math.abs(comparison.value-f.value), rate=distance/dt;
      numbers=num('지금 위치',`${f.value.toFixed(2)} m`)+num('두 시각의 차이',`${dt.toFixed(1)}초`)+num('위치 변화량',`${distance.toFixed(2)} m`)+num('평균 변화율',`${rate.toFixed(2)} m/s`);
      reading=`${distance.toFixed(2)} m ÷ ${dt.toFixed(1)}초 = ${rate.toFixed(2)} m/s<br>‘${Math.min(f.t,comparison.t).toFixed(1)}초부터 ${Math.max(f.t,comparison.t).toFixed(1)}초까지’의 평균 속력입니다.`;
      const max=data.frames.at(-1).value;
      physical=`<div class="learn-road"><span style="left:${8+80*f.value/max}%" aria-hidden="true">🚗</span></div><p>출발점에서 ${f.value.toFixed(1)} m 이동했어요.</p>`;
      boundary='자동차는 한 방향으로만 움직입니다. 주황색 두 점 사이의 평균 속력과 한 순간의 속력을 구별해 보세요.';
    } else if(id==='cooling') {
      const rate=-(this.params.rate)*(f.value-20), dt=data.dt, predicted=f.value+rate*dt;
      numbers=num('차의 온도',`${f.value.toFixed(2)} °C`)+num('주변 공기',`20.00 °C`)+num('지금의 온도차',`${(f.value-20).toFixed(2)} °C`)+num('현재 규칙으로 다음 값 예측',`${predicted.toFixed(2)} °C`);
      reading=`지금의 변화율은 ${rate.toFixed(2)} °C/분입니다.<br>${f.value.toFixed(2)} + (${rate.toFixed(2)}) × ${dt} ≈ ${predicted.toFixed(2)} °C<br>음수는 온도가 내려간다는 뜻이에요.`;
      physical=`<div class="learn-cup" style="--tea-color:hsl(${28+120*(80-f.value)/60} 65% 48%)">☕<strong>${f.value.toFixed(1)}°C</strong><span>공기는 20°C</span></div>`;
      boundary='차 전체의 온도가 같다고 가정합니다. 주변 공기는 20°C로 유지되고, 증발 등은 생략한 냉각 모형입니다.';
    } else if(id==='partial') {
      const i=this.probe, deltaT=(comparison.values[i]-f.values[i])/(comparison.t-f.t);
      const spatial=(f.values[i+1]-f.values[i-1])/(2*data.dx);
      numbers=num('고정해서 관찰할 위치',`${data.x[i]} cm`)+num('현재 온도',`${f.values[i].toFixed(2)} °C`)+num('시간 변화율 근사',`${deltaT.toFixed(3)} °C/s`)+num('공간 변화율 근사',`${spatial.toFixed(3)} °C/cm`);
      reading='시간 변화율의 단위는 °C/s, 공간 변화율의 단위는 °C/cm입니다. 온도를 시간으로 나누었는지 거리로 나누었는지가 달라요.<br>온도가 높은 곳이라도 그 순간의 온도 변화율이 클 수도, 작을 수도 있어요.';
      boundary='막대의 양끝은 20°C입니다. 표시한 시간 변화율은 이웃한 두 저장 시각의 평균, 공간 변화율은 좌우 두 점 사이의 평균입니다.';
    } else if(id==='heat' || id==='plate') {
      const k=id==='plate'?this.probeY*data.n+this.probe:this.probe, u=f.values;
      const neighbours=id==='plate'?[u[k-1],u[k+1],u[k-data.n],u[k+data.n]]:[u[k-1],u[k+1]];
      const average=neighbours.reduce((a,b)=>a+b,0)/neighbours.length;
      const tendency=data.alpha*neighbours.length*(average-u[k])/data.dx**2;
      numbers=num('중앙 온도',`${u[k].toFixed(2)} °C`)+num(`${neighbours.length}개 이웃의 평균`,`${average.toFixed(2)} °C`)+num('이웃 평균 − 중앙',`${(average-u[k]).toFixed(3)} °C`)+num('계산한 온도 변화율',`${tendency.toFixed(3)} °C/s`);
      reading=`<div class="learn-neighbours">${id==='plate'?`위 ${u[k+data.n].toFixed(1)}°C<br>`:''}왼쪽 ${u[k-1].toFixed(1)}°C · <b>중앙 ${u[k].toFixed(1)}°C</b> · 오른쪽 ${u[k+1].toFixed(1)}°C${id==='plate'?`<br>아래 ${u[k-data.n].toFixed(1)}°C`:''}</div>${tendency<-1e-6?'중앙이 이웃 평균보다 높아서 식는 방향입니다.':tendency>1e-6?'중앙이 이웃 평균보다 낮아서 따뜻해지는 방향입니다.':'중앙과 이웃 평균이 거의 같아, 이 순간의 변화가 작습니다.'}`;
      boundary=`가장자리는 20°C로 유지됩니다. 색과 세로축 범위를 고정하여 실제로 식는 정도를 비교합니다. 격자 간격은 ${data.dx} cm입니다.`;
    } else if(id==='wave') {
      const i=this.probe, q=f.values, v=f.velocity, a=data.speed**2*(q[i-1]-2*q[i]+q[i+1])/data.dx**2;
      numbers=num('지켜보는 위치',`${data.x[i].toFixed(1)} cm`)+num('평형선에서의 높이',`${q[i].toFixed(2)} cm`)+num('움직이는 속도',`${v[i].toFixed(2)} cm/s`)+num('속도의 변화율 · 가속도',`${a.toFixed(2)} cm/s²`);
      reading=`속도의 부호: +는 위로, −는 아래로 움직입니다.<br>지금 가속도는 ${a<0?'아래':a>0?'위':'변화 없음'} 방향입니다. ${Math.abs(v[i])<0.01&&Math.abs(a)>0.01?'지금은 거의 멈췄어도 가속도는 남아 있어요.':'위치·속도·가속도가 서로 다른 값임을 확인해 보세요.'}`;
      boundary='양끝 고정, 처음 속도 0, 마찰 없음. 세로축은 줄의 변위이며 물 전체의 유동을 계산한 예제는 아닙니다.';
    }
    $('#introNumbers').innerHTML=numbers;$('#introReading').innerHTML=reading;$('#introPhysical').innerHTML=physical;$('#introPhysical').hidden=!physical;$('#introBoundary').textContent=boundary;
    $('#introPlotHeading').innerHTML=id==='plate'?'금속판의 온도 <span>색 범위 20~80°C · 눌러서 위치 선택</span>':id==='partial'?'같은 시각에서 위치별 온도 보기 <span>시간을 고정했어요</span>':id==='wave'?'같은 시각의 줄 모양 <span>주황색 점을 지켜보세요</span>':id==='heat'?'같은 시각의 온도 분포 <span>주황색 점과 이웃을 비교하세요</span>':'시간과 함께 변하는 값';
    $('#introLegend').innerHTML=id==='cooling'?'<span class="orange">━ 한 걸음씩 계산한 온도</span><span>┄ 연속 냉각 모형의 해</span>':id==='plate'?'<span>차가움 20°C</span><span class="learn-colorbar"></span><span>뜨거움 80°C</span>':id==='slope'?'<span class="teal">━ 시간별 위치</span><span class="orange">● 두 시각의 값과 그 사이 기울기</span>':'<span>┄ 처음 모습</span><span class="teal">━ 현재 모습</span><span class="orange">● 관찰하는 값</span>';
    this.draw();
  }

  draw() {
    if(this.root.hidden || !this.data)return;
    const $=s=>this.root.querySelector(s), canvas=$('#introMainCanvas');if(!canvas)return;
    const id=this.lesson.id, data=this.data, f=data.frames[this.index], all=data.frames;
    if(id==='slope' || id==='cooling') {
      const next=this.index<all.length-1?all[this.index+1]:all[this.index-1];
      introLinePlot(canvas,all.map(a=>a.t),id==='slope'?[{y:all.map(a=>a.value),color:'#087f8c'}]:[
        {y:all.map(a=>a.exact),color:'#8d9aa8',dashed:true},{y:all.map(a=>a.value),color:'#c46b14'}],
        {x0:0,x1:all.at(-1).t,y0:0,y1:id==='slope'?Math.max(10,Math.ceil(all.at(-1).value*1.08/5)*5):100,xlabel:id==='slope'?'시간 (초)':'시간 (분)',ylabel:id==='slope'?'위치 (m)':'온도 (°C)'},[f.t,f.value],id==='slope'?[[f.t,f.value],[next.t,next.value]]:null);
    } else if(id==='plate') {
      const {ctx,w,h}=introCanvas(canvas), size=Math.min(w-72,h-48), left=(w-size)/2-8, top=15, cell=size/data.n;
      this.plateRect={x:left,y:top,size};
      for(let j=0;j<data.n;j++)for(let i=0;i<data.n;i++) {
        const value=f.values[j*data.n+i], a=Math.max(0,Math.min(1,(value-20)/60));
        ctx.fillStyle=`hsl(${215-190*a} ${65+15*a}% ${92-44*a}%)`;
        ctx.fillRect(left+i*cell,top+(data.n-1-j)*cell,cell+0.4,cell+0.4);
      }
      ctx.strokeStyle='#714413';ctx.lineWidth=2;ctx.strokeRect(left+this.probe*cell,top+(data.n-1-this.probeY)*cell,cell,cell);
      ctx.font='12px sans-serif';ctx.fillStyle='#374c60';ctx.textAlign='center';ctx.fillText('x: 0 → 24 cm',left+size/2,top+size+22);
      ctx.save();ctx.translate(left-13,top+size/2);ctx.rotate(-Math.PI/2);ctx.fillText('y: 0 → 24 cm',0,0);ctx.restore();
    } else {
      const wave=id==='wave', maxX=data.x.at(-1);
      introLinePlot(canvas,data.x,[{y:all[0].values,color:'#9daab7',dashed:true},{y:f.values,color:'#087f8c'}],
        {x0:0,x1:maxX,y0:wave?-3.5:15,y1:wave?3.5:85,xlabel:'위치 (cm)',ylabel:wave?'줄의 변위 (cm)':'온도 (°C)'},[data.x[this.probe],f.values[this.probe]]);
      if(id==='partial')introLinePlot($('#introTimeCanvas'),all.map(a=>a.t),[{y:all.map(a=>a.values[this.probe]),color:'#087f8c'}],
        {x0:0,x1:all.at(-1).t,y0:15,y1:85,xlabel:'시간 (초)',ylabel:'온도 (°C)'},[f.t,f.values[this.probe]]);
    }
  }
}
